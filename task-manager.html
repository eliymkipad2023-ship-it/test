<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経営者タスク管理 | Executive Task Manager</title>
    <link rel="stylesheet" href="css/task-manager.css">
</head>
<body>
    <!-- 認証画面 -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <h1>🔐 経営者タスク管理</h1>
                <p>アクセスするにはパスワードを入力してください</p>
            </div>
            <form id="authForm" class="auth-form">
                <div class="auth-form-group">
                    <input type="password" id="passwordInput" placeholder="パスワードを入力" required autocomplete="off">
                </div>
                <button type="submit" class="auth-btn">ログイン</button>
                <div id="authError" class="auth-error hidden">パスワードが正しくありません</div>
            </form>
            <div class="auth-footer">
                <small>セキュアな経営者専用タスク管理システム</small>
            </div>
        </div>
    </div>

    <!-- メインアプリケーション（認証後に表示） -->
    <div class="container" id="mainApp" style="display: none;">
        <header>
            <div class="header-content">
                <div>
                    <h1>📊 経営者タスク管理</h1>
                    <p class="subtitle">効率的なタスク管理で生産性を最大化</p>
                </div>
                <button id="logoutBtn" class="logout-btn">ログアウト</button>
            </div>
        </header>

        <div class="stats-dashboard">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">総タスク数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">完了</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">未完了</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="highPriorityTasks">0</div>
                <div class="stat-label">高優先度</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 タスクを検索...">
            </div>
            <div class="filter-controls">
                <select id="filterPriority">
                    <option value="all">すべての優先度</option>
                    <option value="high">高</option>
                    <option value="medium">中</option>
                    <option value="low">低</option>
                </select>
                <select id="filterCategory">
                    <option value="all">すべてのカテゴリー</option>
                    <option value="meeting">会議</option>
                    <option value="project">プロジェクト</option>
                    <option value="decision">重要決定</option>
                    <option value="delegation">デリゲーション</option>
                    <option value="finance">財務</option>
                    <option value="strategy">戦略</option>
                    <option value="other">その他</option>
                </select>
                <select id="filterStatus">
                    <option value="all">すべてのステータス</option>
                    <option value="pending">未完了</option>
                    <option value="completed">完了</option>
                </select>
            </div>
        </div>

        <div class="task-form-container">
            <button class="btn-add-task" id="btnShowForm">+ 新しいタスクを追加</button>

            <form id="taskForm" class="task-form hidden">
                <h3 id="formTitle">新しいタスクを追加</h3>
                <div class="form-group">
                    <label for="taskTitle">タスク名 *</label>
                    <input type="text" id="taskTitle" required placeholder="例: 重要な会議の準備">
                </div>

                <div class="form-group">
                    <label for="taskDescription">詳細</label>
                    <textarea id="taskDescription" rows="3" placeholder="タスクの詳細を入力..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">優先度 *</label>
                        <select id="taskPriority" required>
                            <option value="high">高</option>
                            <option value="medium" selected>中</option>
                            <option value="low">低</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskCategory">カテゴリー *</label>
                        <select id="taskCategory" required>
                            <option value="meeting">会議</option>
                            <option value="project">プロジェクト</option>
                            <option value="decision">重要決定</option>
                            <option value="delegation">デリゲーション</option>
                            <option value="finance">財務</option>
                            <option value="strategy">戦略</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDeadline">期限</label>
                        <input type="date" id="taskDeadline">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelForm">キャンセル</button>
                </div>
            </form>
        </div>

        <div class="tasks-container">
            <div id="tasksList" class="tasks-list">
                <!-- タスクがここに動的に表示されます -->
            </div>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>
                <h3>タスクがありません</h3>
                <p>上の「+ 新しいタスクを追加」ボタンをクリックして、最初のタスクを作成しましょう。</p>
            </div>
        </div>

        <!-- カレンダービュー -->
        <div class="calendar-container">
            <div class="calendar-header-section">
                <h2>📅 カレンダービュー</h2>
                <div class="calendar-view-tabs">
                    <button class="calendar-tab active" data-view="month">月間</button>
                    <button class="calendar-tab" data-view="week">週間</button>
                    <button class="calendar-tab" data-view="day">1日</button>
                </div>
            </div>

            <div class="calendar-navigation">
                <button class="calendar-nav-btn" id="prevPeriod">‹ 前</button>
                <h3 id="currentPeriod">2026年1月</h3>
                <button class="calendar-nav-btn" id="nextPeriod">次 ›</button>
                <button class="calendar-nav-btn today-btn" id="todayBtn">今日</button>
            </div>

            <!-- 月間ビュー -->
            <div class="calendar-view" id="monthView">
                <div class="calendar-weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>
                <div class="calendar-days" id="monthDays">
                    <!-- 日付がここに動的に表示されます -->
                </div>
            </div>

            <!-- 週間ビュー -->
            <div class="calendar-view hidden" id="weekView">
                <div class="calendar-weekdays">
                    <div class="weekday time-col">時間</div>
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>
                <div class="calendar-week-grid" id="weekGrid">
                    <!-- 週間カレンダーがここに動的に表示されます -->
                </div>
            </div>

            <!-- 1日ビュー -->
            <div class="calendar-view hidden" id="dayView">
                <div class="calendar-day-header" id="dayHeader">
                    <!-- 日付ヘッダーがここに表示されます -->
                </div>
                <div class="calendar-day-grid" id="dayGrid">
                    <!-- 1日のタスクがここに動的に表示されます -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/task-manager.js"></script>
</body>
</html>
